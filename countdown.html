<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Davide Pisanò">

    <title>Countdown</title>

    <style>
        .countdown-page {
            text-align: center;
            margin-top: 5em;
        }

        .countdown {
            display: flex;
            justify-content: center;
            align-items: baseline;
            gap: 0;
            margin: 3em 0 2em;
        }

        .countdown-item {
            padding: 0 2em;
            border-right: 1px solid #aaa;
        }

        .countdown-item:first-child {
            padding-left: 0;
        }

        .countdown-item:last-child {
            padding-right: 0;
            border-right: none;
        }

        .countdown-value {
            font-family: 'Arimo', sans-serif;
            font-size: 4em;
            line-height: 1;
            font-variant-numeric: tabular-nums;
        }

        .countdown-label {
            display: block;
            margin-top: 0.6em;
            font-family: 'Arimo', sans-serif;
            font-size: 0.75em;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        .countdown-date {
            color: #666;
            font-size: 0.9em;
            font-family: 'Arimo', sans-serif;
        }

        @media (max-width: 500px) {
            .countdown-page {
                margin-top: 3em;
            }

            .countdown-page h1 {
                font-size: 1.5em;
            }

            .countdown {
                margin-top: 2em;
            }

            .countdown-item {
                padding: 0 0.8em;
            }

            .countdown-value {
                font-size: 2.5em;
            }

            .countdown-label {
                font-size: 0.65em;
            }
        }

    </style>
</head>

<body>
    <main class="countdown-page">
        <div class="countdown">
            <div class="countdown-item">
                <span class="countdown-value" id="days">--</span>
                <span class="countdown-label">giorni lavorativi</span>
            </div>

            <div class="countdown-item">
                <span class="countdown-value" id="hours">--</span>
                <span class="countdown-label">ore</span>
            </div>

            <div class="countdown-item">
                <span class="countdown-value" id="minutes">--</span>
                <span class="countdown-label">minuti</span>
            </div>
        </div>

        <div class="countdown-date">
            30 ottobre 2026 · 18:00
        </div>
    </main>

    <script>
        const END = new Date("2026-10-30T18:00:00");

        function isWorkingDay(date) {
            const day = date.getDay();
            return day >= 1 && day <= 5;
        }

        function remaining(now) {
            if (now >= END) return { days: 0, hours: 0, minutes: 0 };

            // prossime 18:00 (setHours/setDate lavorano in ora locale: nessun problema col cambio ora)
            const next = new Date(now);
            next.setHours(18, 0, 0, 0);
            if (next <= now) {
                next.setDate(next.getDate() + 1);
                next.setHours(18, 0, 0, 0);
            }

            // quanti blocchi lavorativi terminano da "next" fino a END (incluso)
            let blocks = 0;
            const d = new Date(next);
            while (d <= END) {
                if (isWorkingDay(d)) blocks++;
                d.setDate(d.getDate() + 1);
                d.setHours(18, 0, 0, 0);
            }

            if (isWorkingDay(next)) {
                // sono dentro un blocco lavorativo: giorni interi + tempo fino alle 18:00
                const ms = next - now;
                return {
                    days: blocks - 1,
                    hours: Math.floor(ms / 3600000),
                    minutes: Math.floor((ms % 3600000) / 60000)
                };
            }
            // il blocco in corso finisce di sabato o domenica: non conta, tempo fermo
            return { days: blocks, hours: 0, minutes: 0 };
        }

        function updateCountdown() {
            const r = remaining(new Date());
            document.getElementById("days").textContent = r.days;
            document.getElementById("hours").textContent = String(r.hours).padStart(2, "0");
            document.getElementById("minutes").textContent = String(r.minutes).padStart(2, "0");
        }

        updateCountdown();
        setInterval(updateCountdown, 1000);
    </script>

</body>
</html>
